    var lc = links.getContext('2d');
    function sizeLinks() { links.width = Math.round(innerWidth * dpr); links.height = Math.round(innerHeight * dpr); }

      lc.setTransform(dpr, 0, 0, dpr, 0, 0);
      lc.clearRect(0, 0, innerWidth, innerHeight);

      lc.translate(innerWidth / 2, innerHeight / 2);
      var boil = Math.floor(now / 83); // a new wobble twelve times a second

    // The path: a figure eight on its side (once across for twice up and down), so the body behind the head always
    // bends in an S. It winds out from the middle: its size eases in (to the power 2.2) over the first 1.3s.
    function path(s) {

    // c u^2.5, plus b (u - ZOOM)^3 past ZOOM: the stack grows very slowly at first and faster and faster, reaching full size
    // at u = ZOOM (1.7s), and from there the cubic term, which joins on with no jolt, makes the zoom: in 0.35s the
    // head grows to more than the screen's size (the others sixteen times), all clearing as they go. If the page is ready
    // by then, u simply keeps time and nothing ever slows down. If it isn't, u eases to a stop just short of ZOOM
    // (its speed falling off over the last 0.35s), the stack holding at full size while it slithers on, and when
    // the page is ready u picks up speed again over about 0.2s and runs on into the zoom. Each item is 20ms behind
    // the one ahead in the zoom and is drawn to the middle as it swells.
    var S0 = 0.18, ZOOM = 1.7, PW = 2.5, C = -Math.log(S0) / Math.pow(ZOOM, PW), SPAN = 0.35;
    var lift = C * (Math.pow(ZOOM + SPAN, PW) - Math.pow(ZOOM, PW));
    items.forEach(function (it, k) {
      var F = k ? 16 : Math.max(16, 1.2 * large / it.w);
      it.B = (Math.log(F) - lift) / Math.pow(SPAN, 3);
    });
    var u = 0, rate = 1, lastNow = 0, handed = false, asked = false;
    // The intro's own clock, clk (seconds). It starts only once the site has set up its 3D scene and the page then
    // paints steadily (three frames in a row less than 50ms apart; or after 1.2s at most), so the site's own heavy
    // start-up is over before the intro begins and it never begins mid-stutter. It never moves on more than
    // a thirtieth of a second a frame: when the page stalls (the site setting itself up), the intro pauses there

      if (asked) rate += (1 - rate) * (1 - Math.exp(-dt / 0.2));

        if (!it.since) it.since = now;
        // Coming out. The head just fades in over 0.35s at its small size and from then on only follows the size
        // curve, so its growth only ever speeds up. The others come out from half size over 0.4s on a
        // smootherstep, which starts and ends without a jolt. A picture that loads late fades in over 0.25s.

        var ho = Math.min(1, sk / 0.35), appear = k ? ss : ho * ho * (3 - 2 * ho), emerge = k ? 0.5 + 0.5 * ss : 1;

  })();
