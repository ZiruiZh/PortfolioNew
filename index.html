<style>
  /* The loading screen: a row of the 3D view's own pixel loops (the favicon's crosses in the middle) on Info's light ground. */
  #zz-loader{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;

<script>
  (function () {
    var root = document.getElementById('zz-loader'), canvas = root.querySelector('canvas'), label = root.querySelector('.zl-pct');
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var N = 16, GLYPHS = 5;
    var cell = innerWidth < 480 ? 3 : 4, gap = cell * 5, size = N * cell;
    var width = GLYPHS * size + (GLYPHS - 1) * gap, dpr = Math.min(2, devicePixelRatio || 1);

    canvas.style.width = width + 'px'; canvas.style.height = size + 'px';
    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    function cross(put, x, y, c) { for (var a = -1; a <= 1; a++) { put(x + a, y, c); put(x, y + a, c); } }
    // Five of the scene's eight-frame pixel loops, drawn on its 16 x 16 grid.
    var LOOPS = [
      function (put, t, c) { var r = t % 4; for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) { var o = Math.floor(Math.max(Math.abs(x - 7.5), Math.abs(y - 7.5)) / 2); if (o <= r) put(x, y, c[o % c.length]); } },
      function (put, t, c) { var r = [0, 1, 2, 4, 5, 4, 2, 1][t], i; for (i = -r; i <= r; i++) { put(7 + i, 7, c[0]); put(7, 7 + i, c[0]); } if (t % 2) for (i = 1; i <= Math.ceil(r / 2); i++) { put(7 + i, 7 + i, c[1]); put(7 - i, 7 - i, c[1]); put(7 + i, 7 - i, c[1]); put(7 - i, 7 + i, c[1]); } },
      function (put, t, c) { var r = 2 + [0, 1, 2, 3, 3, 2, 1, 0][t]; [[7, 7 - r], [7 + r, 7], [7, 7 + r], [7 - r, 7]].forEach(function (q, i) { cross(put, q[0], q[1], c[(i + t) % c.length]); }); put(7, 7, c[(t + 2) % c.length]); },
      function (put, t, c) { for (var i = 0, n = 10 + t * 9; i < n; i++) { var a = i * .32, d = .4 + i * .085; put(Math.round(7.5 + Math.cos(a) * d), Math.round(7.5 + Math.sin(a) * d), c[i % 3 === 0 ? 1 : 0]); } },
      function (put, t, c) { for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) { var d = Math.hypot(x - 7.5, y - 7.5), o = Math.round(d / 2); if (Math.abs(d - o * 2) < .6 && o <= 4 && o > 0) put(x, y, (o + 8 - t) % 4 === 0 ? c[1] : c[o % 2 ? 0 : 2]); } }
    ];
    var COLOURS = [['#12a9e8', '#fccc0a', '#ff1a3c'], ['#ff5cf0', '#fccc0a'], ['#ff1a3c', '#12a9e8', '#fccc0a'], ['#2b40d0', '#ff6a13'], ['#00cc99', '#ff1a3c', '#12a9e8']];

        var order = Math.abs(g - 2);

    var shown = 0;
    window.zzLoader = {
      set: function (p) {
        p = Math.max(shown, Math.min(100, Math.round(p)));
        if (p === shown) return;
        shown = p; label.textContent = p + '%'; root.setAttribute('aria-valuenow', p);
      },
      done: function () {
        if (root.classList.contains('is-done')) return;
        this.set(100);
        root.classList.add('is-done');
        setTimeout(function () { clearInterval(timer); root.remove(); }, 700);
      }
    };
    // Never stuck: whatever happens, the page shows within twelve seconds.
    setTimeout(function () { window.zzLoader.done(); }, 12000);
  })();
