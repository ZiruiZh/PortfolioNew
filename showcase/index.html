        'float g=fract(sin(dot(gl_FragCoord.xy+t*37.0,vec2(12.9898,78.233)))*43758.5453);col+=(g-0.5)*0.09;' +

  // ---- the icons: the site's own loops (shapes.js and tiles.js, the same code), roughed and grained as the 3D
  // view draws them, shown pixel-sharp at one and a half times ------------------------------------------------------
  var Tg = [];
  var ZZ_ROUGH = 0.65; // edges a little less diffused than on the site (tiles.js)
  // Smooth animated shapes (2026-11-14), after a second set of references: transit signage, Swiss posters, VHS sleeves
// and flat colour pictograms. Bold, simple and brightly coloured. Shared by the 3D view's floating loops (tiles.js,
// which roughs them up and grains them like the pixel tiles) and the loading screen (loader.html, which runs before
// the site's own script), so both are inlined from here by patch-bundle.py.
//
// Each entry is [draw, colourways]. draw(c, t, way) paints frame t (0-7) of an eight-frame, one-second loop onto a
// 128 x 128 square whose background (way[0]) is already filled. With only 8 frames a loop, the motions are ones that
// read well in steps and join up seamlessly: turns by exactly one step of a shape's own symmetry, stripes and dashes

var zzShapes = (function () {

    // A signage arrow nudging out along its own direction and settling back.
    [(c, t, [, a]) => {

    [(c, t, [, a]) => {

      c.translate(64, 64); c.rotate(t / 8 * TAU / 4);

    }, [[E, K]]],
    // A bold plus in a disc: still, then a quarter turn (which looks the same) in one eased move.
    [(c, t, [, a, d]) => {
      c.fillStyle = a; disc(c, 64, 64, 50);
      c.fillStyle = d;

// Pixel tiles for the 3D view's floating loops, after the reference sheet of flat colour tiles (2026-11-13).
// patch-bundle.py (section 32) inserts this file into the bundle right after the loops' own list (Tg) and before any
// of them are drawn. Like the others, each is a 16 x 16 grid drawn for 8 frames (a one-second loop at 8 frames a
// second) and given the same printed grain; unlike them each fills its whole square with a flat colour, keeps
// its own colours (one or two colourways, not four random ones), and has its edges diffused and worn (rough, below).
// The drawing function gets set(x, y, colour), the frame t (0-7) and the colourway [background, shape, ...]. The
// smooth shapes further down (vec) draw straight onto the 128 x 128px frame instead of the 16 x 16 grid.
{
  const G = '#18c64a', R = '#ff5714', B = '#2b40d0', Y = '#ffe100', P = '#f8a0e6', C = '#66e6e0', W = '#ffffff', D = '#ff1a3c';

  // two colours each pixel may take the colour of a pixel up to 3px away (a sprayed, diffused edge); the tile's own
  // outline wears away unevenly, more at the very edge. The noise is new each frame, so edges shimmer slightly as the
  // loop plays, like hand-drawn line boil. The site's usual grain goes on afterwards.

  // leaves it unset, at 1.

    const img = ctx.getImageData(x0, 0, SIZE, SIZE), d = img.data, src = new Uint8ClampedArray(d);
    const same = (a, b) => src[a] === src[b] && src[a + 1] === src[b + 1] && src[a + 2] === src[b + 2];
    const at = (x, y) => (Math.min(SIZE - 1, Math.max(0, y)) * SIZE + Math.min(SIZE - 1, Math.max(0, x))) * 4;
    // Which of the 16 x 16 grid cells touch a cell of another colour; only their pixels can change.
    const near = new Uint8Array(256);
    for (let cy = 0; cy < 16; cy++) for (let cx = 0; cx < 16; cx++) {
      const o = at(cx * 8 + 4, cy * 8 + 4);
      for (let j = -1; j <= 1 && !near[cy * 16 + cx]; j++) for (let i = -1; i <= 1; i++) {
        if (!same(o, at((cx + i) * 8 + 4, (cy + j) * 8 + 4))) { near[cy * 16 + cx] = 1; break; }
      }

    for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
      const o = (y * SIZE + x) * 4, edge = Math.min(x, y, SIZE - 1 - x, SIZE - 1 - y);
      if (edge < WEAR && rnd() < (WEAR - edge) * 0.2) { d[o + 3] = 0; continue; }
      if (!everywhere && !near[(y >> 3) * 16 + (x >> 3)]) continue;
      const so = at(x + Math.round((rnd() + rnd() - 1) * REACH), y + Math.round((rnd() + rnd() - 1) * REACH));
      if (!same(o, so) && rnd() < 0.7 * ROUGH) d[o] = src[so], d[o + 1] = src[so + 1], d[o + 2] = src[so + 2];

    let k = -1;

      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) set(x, y, way[0]);

    for (let x = 0; x < row.length; x++) if (row[x] === 'X') set(x0 + x, y0 + y, colour);
  });
  const turn = (x, y, k) => { for (; k > 0; k--) [x, y] = [15 - y, x]; return [x, y]; };

  // A square spiral, 1px line and 1px gap, from the edge in.
  const spiral = [];
  {
    let x = 1, y = 1, dx = 1, dy = 0;
    spiral.push([x, y]);
    for (const n of [13, 13, 13, 11, 11, 9, 9, 7, 7, 5, 5, 3, 3, 1]) {
      for (let i = 0; i < n; i++) { x += dx; y += dy; spiral.push([x, y]); }
      [dx, dy] = [-dy, dx];

  // 9 cells they sat half a cell left of it.
  const HEART = ['.XXX....XXX.', 'XXXXX..XXXXX', 'XXXXXXXXXXXX', 'XXXXXXXXXXXX', 'XXXXXXXXXXXX',
    '.XXXXXXXXXX.', '..XXXXXXXX..', '...XXXXXX...', '....XXXX....', '.....XX.....'];
  const HEART_SMALL = ['.XX....XX.', 'XXXX..XXXX', 'XXXXXXXXXX', 'XXXXXXXXXX', '.XXXXXXXX.', '..XXXXXX..', '...XXXX...', '....XX....'];
  const QUESTION = ['.XXXXX.', 'XX...XX', 'XX...XX', '.....XX', '....XX.', '...XX..', '...XX..', '.......', '...XX..', '...XX..'];

  Tg.push(
    // Square spiral, turning a quarter every two frames.
    tile((set, t, [, c]) => spiral.forEach(([x, y]) => set(...turn(x, y, (t >> 1) & 3), c)), [[G, B], [Y, D]]),
    // Play: the triangle nudges forward and settles back.
    tile((set, t, [, c]) => {
      const o = [0, 0, 1, 2, 2, 2, 1, 0][t];
      [1, 3, 5, 7, 9, 9, 7, 5, 3, 1].forEach((w, i) => { for (let x = 0; x < w; x++) set(4 + o + x, 3 + i, c); });
    }, [[R, B]]),
    // Checkerboard of 2px squares sliding diagonally, a pixel a frame.
    tile((set, t, [, c]) => {
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) if ((((x + t) >> 1) + ((y + t) >> 1)) & 1) set(x, y, c);
    }, [[Y, D], [P, B]]),
    // Brick rows (each row offset by half a brick) sliding along together.
    tile((set, t, [, c]) => {
      for (let y = 0; y < 16; y++) {
        const r = y >> 1;
        for (let x = 0; x < 16; x++) if ((((x + t + (r & 1) * 2) >> 2) & 1)) set(x, y, c);
      }
    }, [[B, D]]),
    // Nested squares moving outward, like a tunnel.
    tile((set, t, [, c]) => {
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const u = Math.floor(Math.max(Math.abs(x - 7.5), Math.abs(y - 7.5)) + 0.5);
        if (((u + 8 - (t >> 1)) >> 1) & 1) set(x, y, c);
      }
    }, [[Y, D], [W, P]]),
    // Heart: lub-dub, then a rest.
    tile((set, t, [, c]) => {
      if ([1, 0, 1, 0, 0, 0, 0, 0][t]) rows(set, HEART, 2, 3, c);
      else rows(set, HEART_SMALL, 3, 4, c);
    }, [[P, D], [R, Y]]),
    // Question mark, bobbing.
    tile((set, t, [, c]) => rows(set, QUESTION, 4, 3 + [0, 0, -1, -1, 0, 0, 1, 1][t], c), [[P, R]]),
    // Exclamation mark: the bar draws down, then the dot lands.
    tile((set, t, [, c]) => {
      const n = Math.min(7, (t + 1) * 2);
      for (let y = 3; y < 3 + n; y++) set(7, y, c), set(8, y, c);
      if (t >= 3) for (const [x, y] of [[7, 11], [8, 11], [7, 12], [8, 12]]) set(x, y, c);
    }, [[B, Y]]),
    // Two chevrons marching left.
    tile((set, t, [, c]) => {
      for (let y = 3; y <= 12; y++) {
        const a = Math.abs(y - 7.5) - 0.5;
        for (let x = 0; x < 16; x++) if ((((x - a + t) % 8) + 8) % 8 < 2) set(x, y, c);
      }
    }, [[W, G]]),
    // Diamond ring, breathing.
    tile((set, t, [, c]) => {
      const r = [4, 5, 6, 7, 7, 6, 5, 4][t];
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const s = Math.abs(x - 7.5) + Math.abs(y - 7.5);
        if ((s >= r - 1 && s <= r) || s <= 1) set(x, y, c);
      }
    }, [[C, B]]),
    // Arrow pointing down-right, nudging along its own direction and settling back. Head and shaft are both two
    // pixels thick (the shaft is a run of 2 x 2 squares, so its steps overlap instead of touching at the corners).
    tile((set, t, [, c]) => {
      const p = 11 + [0, 0, 1, 2, 2, 2, 1, 0][t]; // the tip
      for (let k = 0; k < 6; k++) set(p - k, p, c), set(p - k, p - 1, c), set(p, p - k, c), set(p - 1, p - k, c);
      for (let k = 0; k < 8; k++) for (let j = 0; j < 2; j++) for (let m = 0; m < 2; m++) set(p - 1 - k + j, p - 1 - k + m, c);
    }, [[G, Y]]),
    // Four colour bands scrolling up.
    tile((set, t) => {
      const band = [Y, G, B, D];
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) set(x, y, band[((y + t * 2) >> 2) & 3]);
    }, [[Y]]),
  );

  // ---- The smooth shapes (shapes.js, inlined just before this file), drawn straight onto the 128px frame, then
  // roughed up and grained like the pixel tiles (all over, not only near the 16 x 16 grid's edges).
  const vec = (draw, ways) => {
    const f = (set, t, way, ctx, x0) => {
      ctx.save();
      ctx.translate(x0, 0);
      ctx.beginPath(); ctx.rect(0, 0, SIZE, SIZE); ctx.clip();
      draw(ctx, t, way);
      ctx.restore();
    };
    f.zzSmooth = true;
    return tile(f, ways);
  };
  Tg.push(...zzShapes.map(([draw, ways]) => vec(draw, ways)));
}

  // The scene's printed grain (bundle Mg): fine noise, coarser blotches, rare light specks, worn edges.
  function grain(c, w, h) {
    var img = c.getImageData(0, 0, w, h), d = img.data, r = rng(7 + w);
    var bw = Math.ceil(w / 6), bl = new Float32Array(bw * Math.ceil(h / 6));
    for (var i = 0; i < bl.length; i++) bl[i] = r() - 0.5;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var o = (y * w + x) * 4;
      if (d[o + 3] < 8) continue;
      var n = (r() - 0.5) * 46 + bl[Math.floor(y / 6) * bw + Math.floor(x / 6)] * 26 + (r() < 0.018 ? 70 : 0);
      d[o] += n; d[o + 1] += n; d[o + 2] += n;
      if ((x > 0 && d[o - 1] < 8 || x < w - 1 && d[o + 7] < 8 || y > 0 && d[o - w * 4 + 3] < 8 || y < h - 1 && d[o + w * 4 + 3] < 8) && r() < 0.2) d[o + 3] = Math.floor(d[o + 3] * (0.5 + r() * 0.35));
      else if (r() < 0.012) d[o + 3] = Math.floor(d[o + 3] * 0.5);
    }
    c.putImageData(img, 0, 0);
  }
  function strip(f) {
    var cv = document.createElement('canvas'); cv.width = 1024; cv.height = 128;
    var c = cv.getContext('2d');
    for (var t = 0; t < 8; t++) (function (x0) {
      f(function (x, y, col) { if (x < 0 || y < 0 || x >= 16 || y >= 16) return; c.fillStyle = col; c.fillRect(x0 + x * 8, y * 8, 8, 8); }, t, [], c, x0);
    })(t * 128);
    grain(c, 1024, 128);
    return cv;
  }
  // Tg: the twelve pixel tiles (0-11), then the fifteen smooth shapes (12-26).
  var PICKS = [[12, 'Exit'], [24, 'World'], [5, 'Like'], [20, 'Switch'], [17, 'Add']];
  var icons = PICKS.map(function (p) { return { frames: strip(Tg[p[0]]), label: p[1] }; });
  var SIZE = 192, GAP = 96;

  // ---- one frame ----------------------------------------------------------------------------------------------------
  // n counts frames at 24 a second; the icons step eight times a second (every third frame), as on the site.
  function render(n) {
    var seconds = n / FPS, step = Math.floor(n / 3) % 8;
    drawSky(30 + seconds);
    // Lighter than the site: the contour sky at about half strength over a pale ground.
    ctx.globalAlpha = 1; ctx.fillStyle = '#f1f1ee'; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 0.5; ctx.drawImage(sky, 0, 0); ctx.globalAlpha = 1;
    var total = icons.length * SIZE + (icons.length - 1) * GAP, x0 = (W - total) / 2, y0 = Math.round(H / 2 - SIZE / 2);
    ctx.imageSmoothingEnabled = false;
    icons.forEach(function (ic, i) {
      ctx.drawImage(ic.frames, step * 128, 0, 128, 128, x0 + i * (SIZE + GAP), y0, SIZE, SIZE);
    });
  }

  // ---- live, or exported ---------------------------------------------------------------------------------------------
  // ?export=URL: draws every frame of the 8 seconds in turn and POSTs each as a PNG to URL?name=icons-f0001.png ...; the page
  // title counts them, ending in "done". (Named icons-f0001.png and on.) Otherwise it plays in real time.
  var sink = new URLSearchParams(location.search).get('export');
  if (sink) {
    var n = 0, total = FPS * SECONDS;
    (function next() {
      if (n >= total) { document.title = 'done ' + total; return; }
      render(n);
      out.toBlob(function (blob) {
        var name = 'icons-f' + String(n + 1).padStart(4, '0') + '.png';
        fetch(sink + '?name=' + name, { method: 'POST', body: blob }).then(function () { n++; document.title = n + '/' + total; next(); });
      }, 'image/png');
    })();
  } else {
    var start = performance.now();
    (function loop(now) { render(Math.floor((now - start) / 1000 * FPS)); requestAnimationFrame(loop); })(start);
  }
})();
</script>
</body>
