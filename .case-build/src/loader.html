<div id="zz-loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <canvas class="zl-sky" aria-hidden="true"></canvas>
  <div class="zl-snake" aria-hidden="true"></div>
  <canvas class="zl-links" aria-hidden="true"></canvas>
</div>
<style>
  /* The loading screen: the 3D view's own background (its contour-map sky, drawn by the same shader from Info's
     camera, at Info's 70% over the same ground) and, coming out of the middle of it, a slithering piece of the
     home view's cloud: Playground cards, markers, routes and pixel loops. */
  #zz-loader{position:fixed;inset:0;z-index:2147483000;overflow:hidden;
    background:#d8d8d4;color:#141414;font:500 14px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.01em;
    transition:opacity .6s cubic-bezier(.22,1,.36,1),visibility 0s linear .6s}
  /* The hand-off: the stack zooms in fast and the whole screen fades quickly behind it. Its background is the 3D
     view's own, so what appears is only the scene's works, lattice and pixel loops arriving on it. */
  #zz-loader.is-done{pointer-events:none}
  #zz-loader.is-gone{opacity:0;visibility:hidden;transition:opacity .5s cubic-bezier(.4,0,.2,1),visibility 0s linear .5s}
  #zz-loader .zl-sky{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:.7}
  #zz-loader .zl-snake{position:absolute;left:50%;top:50%;width:0;height:0}
  #zz-loader .zl-snake>*{position:absolute;left:0;top:0;display:block;opacity:0;transform-origin:50% 50%;will-change:transform,opacity;
    -webkit-user-select:none;user-select:none;pointer-events:none}
  #zz-loader .zl-snake>canvas{max-width:none;max-height:none}
  #zz-loader .zl-snake>.zl-px{image-rendering:pixelated}
  #zz-loader .zl-links{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
</style>
<script>

        'vec3 col=uBg*(0.9+0.2*(snoise(d*3.0+t*0.01)*0.5+0.5));' +
        'float h=snoise(d*2.0+vec3(0.0,t*0.05,0.0))*0.6+snoise(d*4.3-vec3(t*0.04))*0.3;h+=snoise(d*38.0)*0.018+snoise(d*90.0)*0.008;' +

    })();

    drawSky(0);

    // ---- the stack: the home view's cloud, slithering out ------------------------------------------------------
    // Made of what the cloud is made of: five Playground pieces in white cards, the scene's markers (one off each
    // piece, a few loose), routes between the markers, and a few of the scene's pixel loops (tiles.js and shapes.js,
    // the same code, so the same pixels, roughed edges and printed grain). The head is the scene's red marker with
    // its white cross, tiny, in the middle. It sets off along a figure eight lying on its side, which winds out
    // from nothing, and the rest come out of the same spot after it, one by one, each following exactly the path of

    function headItem() {

    // ---- markers and routes, as in the cloud ---------------------------------------------------------------------
    // Each piece has a marker just off one of its edges, and six more markers travel loose among the body. Routes

    // slight hand-drawn boil. A route draws itself out once both its ends are out; all of it clears as the zoom begins.

    });

    }
